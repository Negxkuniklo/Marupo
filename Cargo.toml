[package]
name = "markdown_to_pdf"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "Marupo"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = "0.29"
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fontdb = "0.21"
ttf-parser = "0.25"
ab_glyph = "0.2"
tiny-skia = "0.11"
pdf-writer = "0.12"
miniz_oxide = "0.8"
rfd = "0.15"

[build-dependencies]
tiny-skia = "0.11"
